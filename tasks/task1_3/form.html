<!doctype html>
<html lang="en">
  <head>
    <title>Meet our team</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>

  <body>
    <form action="https://httpbin.io/dump/request" method="POST">
        <label for="em">Enter your email:</label>
        <input type="email" id="em" name="email">
        <br>
        <br>
        <label for="nm">Enter your name:</label>
        <input type="name" id="nm" name="name">
        <br>
        <br>
        <label for="dob">Enter your DOB:</label>
        <input type="date" id="dob" name="date"/>
        <br>
        <br>
        <label for="color">Choose your favourite colour:</label>
        <input type="color" name="color" id="color" />
        <br>
        <br>
        <fieldset>
            <legend>Are you a student or staff member?</legend>
                <p>
                <label for="student">Student</label>
                <input type="radio" id="student" name="usertype" value="student"/>
                </p>

                <p>
                <label for="staff">Staff</label>
                <input type="radio" id="staff" name="usertype" value="staff"/>
                </p>
        </fieldset>

        <input type="submit">
    </form>
  </body>
